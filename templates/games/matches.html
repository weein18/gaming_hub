{% extends "base.html" %}
{% block content %}
<div class="main-container" style="padding-top: 130px; max-width: 900px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 60px;">
        <div style="display: inline-block; padding: 6px 15px; background: rgba(227,6,19,0.1); border: 1px solid var(--primary); border-radius: 50px; color: var(--primary); font-size: 0.6rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 15px;">
            ACTIVE EVENTS
        </div>
        <h1 style="font-size: 3.5rem; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: -2px;">
            CHOOSE <span class="highlight">BATTLE</span>
        </h1>
    </div>

    {% for tour in tournaments %}
    <div style="margin-bottom: 30px;"> <a href="{{ url_for('tournament', name=tour.url_name) }}" style="text-decoration: none; color: inherit;">
            <div class="match-card tournament-card" style="padding: 0; border-radius: 16px; overflow: hidden; height: 320px; display: flex; flex-direction: column; background: #0c0c0c; border: 1px solid #1a1a1a;">
                
                <div style="height: 140px; position: relative;">
                    <img src="{{ url_for('static', filename='img/tournaments/' + (tour.name|lower|replace(' ', '_')) + '.png') }}" 
                         style="width: 100%; height: 100%; object-fit: cover; opacity: 0.6;"
                         onerror="this.src='{{ url_for('static', filename='img/tournaments/default.png') }}';">
                    
                    <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(0deg, #0c0c0c, transparent);"></div>
                    
                    <div style="position: absolute; top: 20px; left: 20px;">
                        <span style="background: rgba(40, 167, 69, 0.1); border: 1px solid #28a745; color: #28a745; padding: 4px 8px; border-radius: 4px; font-size: 0.5rem; font-weight: 900; text-transform: uppercase;">● Active</span>
                    </div>
                </div>

                <div style="padding: 0 30px 25px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; margin-top: -20px; z-index: 2;">
                    <div>
                        <h2 style="font-size: 1.6rem; margin: 0 0 8px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px;">{{ tour.name }}</h2>
                        
                        <div style="display: flex; gap: 8px;">
                            <span style="font-size: 0.5rem; color: #ffd700; border: 1px solid rgba(255,215,0,0.2); padding: 3px 8px; border-radius: 4px; font-weight: 800;">S-TIER</span>
                            <span style="font-size: 0.5rem; color: var(--primary); border: 1px solid rgba(227,6,19,0.2); padding: 3px 8px; border-radius: 4px; font-weight: 800;">{{ tour.xp_reward }} XP</span>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: flex-end; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.03);">
                        <div>
                            <div style="font-size: 0.5rem; color: #444; font-weight: 900; text-transform: uppercase; margin-bottom: 2px;">Prize Pool</div>
                            <div style="font-size: 1.1rem; font-weight: 900; color: #fff;">{{ tour.prize_pool }}</div>
                        </div>
                        
                        <div class="enter-btn-fake" style="padding: 8px 20px; border-radius: 6px; background: var(--primary); color: white; font-weight: 900; font-size: 0.65rem; text-transform: uppercase;">
                            Enter Hub
                        </div>
                    </div>
                </div>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
