{% extends "base.html" %}
{% block content %}
<style>
    .elite-grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
        gap: 40px;
        padding: 40px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .tournament-card-elite {
        position: relative;
        height: 500px;
        border-radius: 30px;
        background: #080808;
        border: 1px solid rgba(255, 255, 255, 0.05);
        overflow: hidden;
        transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        text-decoration: none;
        display: flex;
        flex-direction: column;
    }

    /* Фоновое изображение турнира */
    .card-banner {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-size: cover;
        background-position: center;
        transition: 0.8s;
        z-index: 1;
    }

    .tournament-card-elite:hover .card-banner {
        transform: scale(1.1);
    }

    /* Мощный градиент для читаемости текста */
    .card-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, #000 10%, rgba(0,0,0,0.2) 50%, transparent 100%);
        z-index: 2;
    }

    .card-content {
        position: relative;
        z-index: 3;
        padding: 40px;
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .tournament-date-badge {
        position: absolute;
        top: 30px;
        right: 30px;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 8px 15px;
        border-radius: 12px;
        z-index: 3;
    }

    .highlight-red { color: var(--primary); text-shadow: 0 0 20px rgba(227,6,19,0.5); }
</style>

<div class="main-container" style="padding-top: 140px;">
    <div style="text-align: center; margin-bottom: 80px;">
        <h1 style="font-size: 5rem; font-weight: 900; letter-spacing: -4px; text-transform: uppercase; line-height: 0.8;">
            CHOOSE YOUR <br> <span class="highlight-red">BATTLEGROUND</span>
        </h1>
    </div>

    <div class="elite-grid-container">
        {% for tour in tournaments %}
        <a href="{{ url_for('tournament', name=tour.url_name) }}" class="tournament-card-elite">
            
            <div class="card-banner" style="background-image: url('{{ url_for('static', filename='img/tournaments/' + (tour.name|lower|replace(' ', '_')) + '.png') }}'), url('{{ url_for('static', filename='img/tournaments/default.png') }}');"></div>
            
            <div class="card-overlay"></div>

            <div class="tournament-date-badge">
                <div style="font-size: 0.5rem; color: #888; font-weight: 900; text-transform: uppercase;">Event Date</div>
                <div style="font-size: 0.85rem; color: #fff; font-weight: 800;">{{ tour.date if tour.date else "COMING SOON" }}</div>
            </div>

            <div class="card-content">
                <div>
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <span style="background: var(--primary); color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.6rem; font-weight: 900;">LIVE</span>
                        <span style="border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.6rem; font-weight: 900;">{{ tour.xp_reward }} XP</span>
                    </div>
                    <h2 style="font-size: 2.5rem; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: -1.5px; line-height: 1;">
                        {{ tour.name }}
                    </h2>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <div style="font-size: 0.6rem; color: #666; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;">Prize Pool</div>
                        <div style="font-size: 1.8rem; font-weight: 900; color: #fff;">{{ tour.prize_pool }}</div>
                    </div>
                    
                    <div style="padding: 15px 35px; background: white; color: black; border-radius: 15px; font-weight: 900; font-size: 0.75rem; text-transform: uppercase;">
                        Enter Hub
                    </div>
                </div>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
