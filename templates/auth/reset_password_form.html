{% extends "base.html" %}
{% block content %}
<style>
    :root {
        --accent: #ff3b3b;
        --panel-bg: rgba(13, 13, 13, 0.85);
        --border: rgba(255, 255, 255, 0.05);
    }
    .auth-box {
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px;
        max-width: 450px;
        margin: 160px auto 0 auto;
        text-align: center;
    }
    .auth-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        padding: 14px;
        border-radius: 8px;
        color: #fff;
        font-size: 0.85rem;
        margin-bottom: 20px;
        outline: none;
        box-sizing: border-box;
    }
    .auth-input:focus {
        border-color: var(--accent);
    }
</style>

<div class="auth-box">
    <h2 style="font-size: 1.8rem; font-weight: 950; margin: 0 0 10px 0; letter-spacing: -1px;">NEW <span style="color: var(--accent);">PASSWORD</span></h2>
    <p style="font-size: 0.65rem; color: #555; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px;">SECURE YOUR CREDS</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div style="padding: 12px; margin-bottom: 20px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; background: rgba(255,59,59,0.1); border: 1px solid var(--accent); color: #fff;">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="password" name="password" placeholder="ENTER NEW PASSWORD" class="auth-input" required>
        <input type="password" name="confirm_password" placeholder="CONFIRM NEW PASSWORD" class="auth-input" required>
        
        <button type="submit" style="width: 100%; padding: 15px; background: var(--accent); border: none; color: #fff; font-size: 0.7rem; font-weight: 900; letter-spacing: 1px; border-radius: 8px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(255, 59, 59, 0.2);">
            UPDATE CREDENTIALS →
        </button>
    </form>
</div>
{% endblock %}
