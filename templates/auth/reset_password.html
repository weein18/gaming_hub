{% extends "base.html" %}
{% block content %}
<div style="display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;">
    <div class="glass-card" style="width:100%;max-width:440px;padding:40px;">
        <h2 style="font-size:1.8rem;font-weight:900;text-transform:uppercase;letter-spacing:-1px;margin-bottom:8px;">
            New <span style="color:var(--primary)">Password</span>
        </h2>
        <p style="color:#555;font-size:0.75rem;font-weight:700;letter-spacing:2px;margin-bottom:32px;">CHOOSE A STRONG PASSWORD</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div style="padding:12px;border-radius:8px;margin-bottom:20px;background:rgba(227,6,19,0.1);border:1px solid rgba(227,6,19,0.3);color:#e30613;font-size:0.8rem;font-weight:700;">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST" style="display:flex;flex-direction:column;gap:20px;">
            <div class="input-group">
                <label style="font-size:0.6rem;color:#555;font-weight:800;letter-spacing:2px;display:block;margin-bottom:8px;">NEW PASSWORD</label>
                <input type="password" name="new_password" required class="glass-input" placeholder="Min. 8 characters">
            </div>
            <div class="input-group">
                <label style="font-size:0.6rem;color:#555;font-weight:800;letter-spacing:2px;display:block;margin-bottom:8px;">CONFIRM PASSWORD</label>
                <input type="password" name="confirm_password" required class="glass-input" placeholder="Repeat password">
            </div>
            <button type="submit" class="liquid-btn" style="padding:14px;font-weight:900;background:var(--primary);border:none;">UPDATE PASSWORD</button>
        </form>
    </div>
</div>
{% endblock %}
