<form action="{{ url_for('admin_add_tournament') }}" method="POST">
    <input type="text" name="name" placeholder="Tournament Name (e.g. IEM Cologne 2026)">
    <input type="text" name="prize_pool" placeholder="Prize Pool (e.g. $1,000,000)">
    <input type="text" name="dates" placeholder="Dates (e.g. 11th - 19th May)">
    <input type="text" name="xp_reward" placeholder="XP Reward (e.g. 2500)">
    <button type="submit">CREATE TOURNAMENT</button>
</form>
