{% extends "base.html" %}
{% block content %}
<div class="main-container" style="display: flex; flex-direction: column; align-items: center; padding-top: 140px; min-height: 100vh; background: #050505;">
    <div class="match-card" style="width: 100%; max-width: 600px; padding: 50px; background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
        
        <div style="margin-bottom: 30px; border-left: 4px solid var(--primary); padding-left: 20px;">
            <h2 style="text-transform: uppercase; letter-spacing: -1px; color: #fff;">Register New <span class="highlight" style="color: var(--primary);">Tournament</span></h2>
            <p style="font-size: 0.7rem; color: #555; font-weight: 800; letter-spacing: 2px;">GLOBAL EVENT CONFIGURATION</p>
        </div>

        <form action="{{ url_for('admin_add_tournament') }}" method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.6rem; color: var(--primary); font-weight: 900; margin-bottom: 8px; text-transform: uppercase;">Tournament Name</label>
                <input type="text" name="name" placeholder="e.g. BLAST Premier Spring 2026" required
                    style="width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; padding: 12px; font-family: inherit; outline: none;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 0.6rem; color: #888; font-weight: 900; margin-bottom: 8px; text-transform: uppercase;">Prize Pool</label>
                    <input type="text" name="prize_pool" placeholder="$1,250,000" required
                        style="width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; padding: 12px; outline: none;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.6rem; color: #888; font-weight: 900; margin-bottom: 8px; text-transform: uppercase;">XP Reward</label>
                    <input type="text" name="xp_reward" placeholder="3000 XP" required
                        style="width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; padding: 12px; outline: none;">
                </div>
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-size: 0.6rem; color: #888; font-weight: 900; margin-bottom: 8px; text-transform: uppercase;">Event Dates (Duration)</label>
                <input type="text" name="dates" placeholder="May 11th - May 19th" required
                    style="width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; padding: 12px; outline: none;">
            </div>

            <button type="submit" class="liquid-btn" 
                style="width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;">
                Initialize Tournament
            </button>
        </form>
        
        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('admin_add_match') }}" style="color: #444; font-size: 0.7rem; text-decoration: none; font-weight: 700; text-transform: uppercase;">← Back to Matches</a>
        </div>
    </div>
</div>
{% endblock %}
